name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev zlib1g-dev unzip libncurses6:i386 libstdc++6:i386 zlib1g:i386 openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade cython buildozer

    - name: Reverse-Engineer & Force Pre-Install SDK Tools & Licenses
      run: |
        # إنشاء مسارات بيلدوزر الداخلية قسراً
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools
        
        # زرع بصمات التراخيص الرسمية لأندرويد لمنع ظهور (Accept? y/N) للأبد
        echo "8933bac1632f4fe7906bf174efb15daae6137ea2" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f518747f451e06a5bddb4d7afab13355d40f4" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

        # فرض تثبيت الإصدارين 33 و 37 مسبقاً لجعل بيلدوزر يعثر عليهما فوراً دون تحميل
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;37.0.0" || true

    - name: Build APK with Buildozer
      run: |
        cd app && buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ugaritic-apk
        path: app/bin/*.apk
