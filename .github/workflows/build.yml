name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      DEBIAN_FRONTEND: noninteractive
      BUILDOZER_WARN_ON_ROOT: 0

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # بدون i386 لتسريع البناء
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config


      # ============================================================
      # 5. INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

          buildozer --version


      # ============================================================
      # 6. CREATE BUILDOZER SDK DIRECTORY
      # ============================================================
      - name: Create forced Buildozer SDK directory
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"
          mkdir -p "$SDK/build-tools"
          mkdir -p "$SDK/platform-tools"
          mkdir -p "$SDK/platforms"
          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 7. COPY ANDROID COMMAND LINE TOOLS
      # ============================================================
      - name: Inject Android command line tools
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SOURCE_SDK="/usr/local/lib/android/sdk"

          echo "Source SDK: $SOURCE_SDK"
          echo "Target SDK: $SDK"

          if [ ! -d "$SOURCE_SDK/cmdline-tools/latest" ]; then
            echo "ERROR: Android command-line tools not found"
            find /usr/local/lib/android -type f -name sdkmanager || true
            exit 1
          fi

          rm -rf "$SDK/cmdline-tools/latest"

          cp -a \
            "$SOURCE_SDK/cmdline-tools/latest" \
            "$SDK/cmdline-tools/latest"


      # ============================================================
      # 8. CREATE LEGACY SDK COMPATIBILITY
      #
      # مهم:
      # نربط latest كاملاً وليس bin فقط
      # لأن sdkmanager يحتاج bin + lib
      # ============================================================
      - name: Create legacy SDK compatibility
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          # حذف أي tools قديم أو symlink مكسور
          rm -rf "$SDK/tools"

          # ربط cmdline-tools/latest بالكامل
          ln -s \
            "$SDK/cmdline-tools/latest" \
            "$SDK/tools"

          echo "Testing modern sdkmanager..."
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          echo "Testing legacy-compatible sdkmanager..."
          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # 9. PRE-INJECT ANDROID LICENSE HASHES
      # ============================================================
      - name: Pre-inject Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
          8933bac1632f4fe7906bf174efb15daae6137ea2
          d56f518747f451e06a5bddb4d7afab13355d40f4
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

          chmod 644 "$SDK/licenses/android-sdk-license"

          echo "Installed license hashes:"
          cat "$SDK/licenses/android-sdk-license"


      # ============================================================
      # 10. ACCEPT ALL LICENSES
      # ============================================================
      - name: Force accept Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses


      # ============================================================
      # 11. PRE-INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Force pre-install Android SDK packages
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-37" \
            "build-tools;33.0.2" \
            "build-tools;37.0.0"


      # ============================================================
      # 12. ACCEPT LICENSES AGAIN
      # ============================================================
      - name: Re-accept Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses


      # ============================================================
      # 13. VERIFY SDK INSTALLATION
      # ============================================================
      - name: Verify Android SDK installation
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK BUILD TOOLS"
          echo "=========================================="

          ls -la "$SDK/build-tools"

          echo "=========================================="
          echo "VERIFY BUILD TOOLS 33.0.2"
          echo "=========================================="

          test -d "$SDK/build-tools/33.0.2"
          test -f "$SDK/build-tools/33.0.2/aidl"
          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "33.0.2 OK"

          echo "=========================================="
          echo "VERIFY BUILD TOOLS 37.0.0"
          echo "=========================================="

          test -d "$SDK/build-tools/37.0.0"
          test -f "$SDK/build-tools/37.0.0/aidl"
          test -x "$SDK/build-tools/37.0.0/aidl"

          echo "37.0.0 OK"

          echo "=========================================="
          echo "SDK VERIFIED SUCCESSFULLY"
          echo "=========================================="


      # ============================================================
      # 14. FORCE PATCH BUILDOZER CONFIGURATION
      # ============================================================
      - name: Force patch Buildozer SDK configuration
        working-directory: app
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "PATCHING buildozer.spec"
          echo "=========================================="

          if grep -q "^android.sdk_path" buildozer.spec; then
            sed -i \
              "s|^android.sdk_path *=.*|android.sdk_path = $SDK|" \
              buildozer.spec
          else
            echo "" >> buildozer.spec
            echo "# GitHub Actions forced SDK" >> buildozer.spec
            echo "android.sdk_path = $SDK" >> buildozer.spec
          fi

          if grep -q "^android.skip_update" buildozer.spec; then
            sed -i \
              "s|^android.skip_update *=.*|android.skip_update = True|" \
              buildozer.spec
          else
            echo "android.skip_update = True" >> buildozer.spec
          fi

          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              "s|^android.accept_sdk_license *=.*|android.accept_sdk_license = True|" \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo ""
          echo "=========================================="
          echo "FINAL ANDROID CONFIG"
          echo "=========================================="

          grep -E \
            "android.sdk_path|android.skip_update|android.accept_sdk_license|android.api|android.minapi|android.ndk|android.sdk|android.build_tools_version" \
            buildozer.spec || true


      # ============================================================
      # 15. ADD ANDROID TOOLS TO PATH
      # ============================================================
      - name: Inject Android tools into PATH
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # 16. FINAL ENVIRONMENT DIAGNOSTICS
      # ============================================================
      - name: Final Android environment diagnostics
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDK:"
          ls -la "$SDK"

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # 17. CLEAN OLD PROJECT BUILD CACHE
      # ============================================================
      - name: Clean stale project build cache
        working-directory: app
        run: |
          rm -rf .buildozer


      # ============================================================
      # 18. BUILD APK
      # ============================================================
      - name: Build Android APK
        working-directory: app
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Available Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ============================================================
      # 19. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        working-directory: app
        run: |
          set -eux

          echo "=========================================="
          echo "GENERATED FILES"
          echo "=========================================="

          find bin -type f -print

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
