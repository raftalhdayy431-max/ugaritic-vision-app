name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip \
            git \
            curl \
            wget


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1" buildozer
          buildozer --version


      # ============================================================
      # CACHE
      # ============================================================
      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Prepare Android SDK
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SOURCE_SDK="/usr/local/lib/android/sdk"

          mkdir -p "$SDK/licenses"
          mkdir -p "$SDK/build-tools"
          mkdir -p "$SDK/platform-tools"
          mkdir -p "$SDK/platforms"
          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            cp -a "$SOURCE_SDK/cmdline-tools/latest" \
              "$SDK/cmdline-tools/latest"
          fi

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # ACCEPT LICENSES
      # ============================================================
      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


      # ============================================================
      # INSTALL SDK
      # ============================================================
      - name: Install Android SDK components
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          test -x "$SDK/build-tools/33.0.2/aidl"


      # ============================================================
      # CONFIGURE PATH
      # ============================================================
      - name: Configure Android PATH
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # PATCH BUILDOZER SPEC
      # ============================================================
      - name: Configure Buildozer
        working-directory: app
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          sed -i '/^android.sdk_path *=/d' buildozer.spec
          sed -i '/^android.skip_update *=/d' buildozer.spec
          sed -i '/^android.accept_sdk_license *=/d' buildozer.spec

          cat >> buildozer.spec <<EOF

          android.sdk_path = $SDK
          android.skip_update = True
          android.accept_sdk_license = True
          EOF


      # ============================================================
      # INITIALIZE BUILDOZER
      #
      # نجعل Buildozer ينشئ python-for-android محلياً أولاً
      # ============================================================
      - name: Initialize Buildozer environment
        working-directory: app
        run: |
          set -eux

          # هذا الأمر قد يفشل لأننا لا نريد إكمال البناء هنا
          # هدفنا فقط إنشاء python-for-android داخل .buildozer
          buildozer android debug || true


      # ============================================================
      # PATCH FREETYPE RECIPE
      #
      # نستبدل رابط Savannah المعطل بمرآة بديلة
      # ============================================================
      - name: Patch FreeType download source
        working-directory: app
        run: |
          set -eux

          P4A_DIR="$PWD/.buildozer/android/platform/python-for-android"

          echo "Searching python-for-android..."

          if [ ! -d "$P4A_DIR" ]; then
            echo "ERROR: python-for-android directory not found"
            exit 1
          fi

          RECIPE="$P4A_DIR/pythonforandroid/recipes/freetype/__init__.py"

          if [ ! -f "$RECIPE" ]; then
            echo "ERROR: FreeType recipe not found"
            find "$P4A_DIR" -iname "*freetype*" -print
            exit 1
          fi

          echo "======================================"
          echo "ORIGINAL FREETYPE RECIPE"
          echo "======================================"

          grep -n "url\|savannah\|version" "$RECIPE" || true

          # استبدال المصدر الأساسي
          sed -i \
            's|https://download\.savannah\.gnu\.org/releases/freetype/|https://download-mirror.savannah.gnu.org/releases/freetype/|g' \
            "$RECIPE"

          echo "======================================"
          echo "PATCHED FREETYPE RECIPE"
          echo "======================================"

          grep -n "url\|savannah\|version" "$RECIPE" || true


      # ============================================================
      # PRE-DOWNLOAD FREETYPE FROM MULTIPLE MIRRORS
      # ============================================================
      - name: Download FreeType from fallback mirrors
        working-directory: app
        run: |
          set -eux

          BASE="$PWD/.buildozer/android/platform"

          mkdir -p "$BASE/build-arm64-v8a_armeabi-v7a/packages/freetype"

          TARGET="$BASE/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz"

          if [ -s "$TARGET" ]; then
            echo "FreeType already exists."
            exit 0
          fi

          URLS=(
            "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"
            "https://nongnu.uib.no/freetype/freetype-2.14.1.tar.gz"
            "https://mirrors.ocf.berkeley.edu/nongnu/freetype/freetype-2.14.1.tar.gz"
            "https://mirror.netcologne.de/savannah/freetype/freetype-2.14.1.tar.gz"
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download"
          )

          SUCCESS=0

          for URL in "${URLS[@]}"; do

            echo ""
            echo "======================================"
            echo "Trying:"
            echo "$URL"
            echo "======================================"

            rm -f "$TARGET"

            if curl \
              -L \
              --fail \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 3 \
              --retry-all-errors \
              -o "$TARGET" \
              "$URL"; then

              echo "Download succeeded."

              if tar -tzf "$TARGET" > /dev/null 2>&1; then

                echo "Archive is valid."

                SUCCESS=1
                break

              else

                echo "Downloaded file is invalid."

                rm -f "$TARGET"

              fi

            fi

          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: ALL FREETYPE MIRRORS FAILED"
            exit 1
          fi

          echo "======================================"
          echo "VERIFY FREETYPE"
          echo "======================================"

          sha256sum "$TARGET"

          EXPECTED="174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34"

          ACTUAL=$(sha256sum "$TARGET" | awk '{print $1}')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: FreeType checksum mismatch!"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "FreeType successfully downloaded and verified."

          ls -lh "$TARGET"


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Android APK
        working-directory: app
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -o pipefail

          echo "======================================"
          echo "STARTING FINAL APK BUILD"
          echo "======================================"

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: app
        run: |
          set -eux

          find bin -type f -name "*.apk" -print

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          ls -lh "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # UPLOAD LOG IF FAILURE
      # ============================================================
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            app/build.log
          if-no-files-found: ignore
          retention-days: 7
