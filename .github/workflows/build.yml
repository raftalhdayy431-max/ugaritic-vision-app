```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      PYTHON_VERSION: "3.10"
      JAVA_VERSION: "17"

      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      ANDROIDAPI: "33"
      ANDROIDMINAPI: "24"

      P4A_RELEASE: "develop"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 4. System dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            ccache \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5 \
            libncurses6 \
            autoconf \
            automake \
            libtool \
            pkg-config


      # ============================================================
      # 5. Install Buildozer / Cython
      # ============================================================
      - name: Install Buildozer and Cython
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer


      # ============================================================
      # 6. Prepare Android SDK
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="/usr/local/lib/android/sdk"

          mkdir -p "$SDK"

          echo "=========================================="
          echo "Preparing Android SDK"
          echo "=========================================="

          # --------------------------------------------------------
          # Copy installed command-line tools from GitHub runner
          # --------------------------------------------------------
          if [ -d "$SYSTEM_SDK/cmdline-tools/latest" ]; then

            mkdir -p "$SDK/cmdline-tools"

            cp -a \
              "$SYSTEM_SDK/cmdline-tools/latest" \
              "$SDK/cmdline-tools/"

          else
            echo "ERROR: GitHub runner command-line tools not found."
            exit 1
          fi


          # --------------------------------------------------------
          # Android SDK licenses
          # --------------------------------------------------------
          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
8933bac1632f4fe7906bf174efb15daae6137ea2
d56f518747f451e06a5bddb4d7afab13355d40f4
24333f8a63b6825ea9c5514f83c2829b004d1fee
EOF


          # --------------------------------------------------------
          # Modern sdkmanager
          # --------------------------------------------------------
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          chmod +x "$SDKMANAGER"


          echo "sdkmanager version:"
          "$SDKMANAGER" --version


          # --------------------------------------------------------
          # Install only required Android packages
          # --------------------------------------------------------
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


          # --------------------------------------------------------
          # Buildozer compatibility wrapper
          #
          # IMPORTANT:
          # Do NOT symlink tools -> cmdline-tools/latest
          # because that causes duplicate package detection.
          # --------------------------------------------------------
          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<'EOF'
#!/usr/bin/env bash

SDK="$(cd "$(dirname "$0")/../../.." && pwd)"

exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "$@"
EOF

          chmod +x "$SDK/tools/bin/sdkmanager"


          # --------------------------------------------------------
          # Verify wrapper
          # --------------------------------------------------------
          echo "Buildozer sdkmanager wrapper:"
          "$SDK/tools/bin/sdkmanager" --version


          # --------------------------------------------------------
          # Verify required packages
          # --------------------------------------------------------
          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/33.0.2"

          test -f "$SDK/build-tools/33.0.2/aidl"

          echo "=========================================="
          echo "Android SDK READY"
          echo "=========================================="

          find "$SDK/build-tools" -maxdepth 1 -type d -print
          find "$SDK/platforms" -maxdepth 1 -type d -print


      # ============================================================
      # 7. Android PATH
      # ============================================================
      - name: Configure Android environment
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # 8. Force Buildozer configuration
      # ============================================================
      - name: Configure buildozer.spec
        working-directory: app
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "Checking buildozer.spec"
          echo "=========================================="

          grep -n \
            -E \
            "android.api|android.minapi|android.ndk_api|android.sdk|android.build_tools_version|android.archs" \
            buildozer.spec || true


          # --------------------------------------------------------
          # Remove old conflicting values
          # --------------------------------------------------------
          sed -i '/^[[:space:]]*android\.minapi[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk_api[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.sdk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.skip_update[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.accept_sdk_license[[:space:]]*=/d' buildozer.spec


          # --------------------------------------------------------
          # Insert correct Android configuration
          # --------------------------------------------------------
          cat >> buildozer.spec <<'EOF'

# ============================================================
# GitHub Actions Android configuration
# ============================================================

android.api = 33
android.minapi = 24
android.ndk_api = 24

android.sdk = 33
android.build_tools_version = 33.0.2

android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk

android.skip_update = True
android.accept_sdk_license = True
EOF


          echo "=========================================="
          echo "FINAL buildozer.spec Android configuration"
          echo "=========================================="

          grep -n \
            -E \
            "android.api|android.minapi|android.ndk_api|android.sdk|android.build_tools_version|android.sdk_path|android.skip_update|android.accept_sdk_license" \
            buildozer.spec


      # ============================================================
      # 9. Cache Python-for-Android downloads
      # ============================================================
      - name: Restore Python-for-Android cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            app/.buildozer/android/platform/build-*
          key: p4a-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            p4a-${{ runner.os }}-


      # ============================================================
      # 10. Prepare Freetype download
      #
      # The current failure is HTTP 502 from Savannah.
      # Download Freetype BEFORE Buildozer and retry aggressively.
      # ============================================================
      - name: Pre-download Freetype with fallback
        shell: bash
        run: |
          set -eux

          VERSION="2.14.1"
          FILE="freetype-${VERSION}.tar.gz"

          CACHE_DIR="$HOME/.buildozer/android/packages"
          DOWNLOAD_DIR="$CACHE_DIR/freetype"

          mkdir -p "$DOWNLOAD_DIR"

          TARGET="$DOWNLOAD_DIR/$FILE"

          echo "=========================================="
          echo "Preparing Freetype"
          echo "=========================================="

          if [ -s "$TARGET" ]; then
            echo "Freetype already exists:"
            ls -lh "$TARGET"
            exit 0
          fi


          # --------------------------------------------------------
          # URL 1 - Savannah
          # --------------------------------------------------------
          URL1="https://download.savannah.gnu.org/releases/freetype/$FILE"


          # --------------------------------------------------------
          # URL 2 - GitHub official FreeType mirror
          # --------------------------------------------------------
          URL2="https://github.com/freetype/freetype/releases/download/VER-2-14-1/$FILE"


          # --------------------------------------------------------
          # URL 3 - SourceForge
          # --------------------------------------------------------
          URL3="https://sourceforge.net/projects/freetype/files/freetype2/$VERSION/$FILE/download"


          download_file() {

            URL="$1"

            echo ""
            echo "Trying:"
            echo "$URL"

            rm -f "$TARGET.part"

            for attempt in 1 2 3 4 5 6 7 8; do

              echo "Attempt $attempt/8"

              if curl \
                --fail \
                --location \
                --retry 5 \
                --retry-delay 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 300 \
                -A "Mozilla/5.0 GitHub-Actions" \
                "$URL" \
                -o "$TARGET.part"; then

                if [ -s "$TARGET.part" ]; then

                  mv "$TARGET.part" "$TARGET"

                  echo "Download successful."

                  ls -lh "$TARGET"

                  return 0

                fi

              fi

              echo "Download failed."
              sleep 5

            done

            return 1
          }


          # --------------------------------------------------------
          # Try mirrors
          # --------------------------------------------------------
          if ! download_file "$URL1"; then

            echo "Savannah failed."

            if ! download_file "$URL2"; then

              echo "GitHub mirror failed."

              if ! download_file "$URL3"; then

                echo ""
                echo "=========================================="
                echo "ERROR: Could not download Freetype"
                echo "=========================================="

                exit 1

              fi

            fi

          fi


          # --------------------------------------------------------
          # Verify archive
          # --------------------------------------------------------
          echo "Testing Freetype archive..."

          tar -tzf "$TARGET" >/dev/null

          echo "Freetype archive is valid."


      # ============================================================
      # 11. Verify Android environment
      # ============================================================
      - name: Verify Android environment
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "SDK Manager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL:"
          "$SDK/build-tools/33.0.2/aidl" --version

          echo ""
          echo "Platform:"
          ls -la "$SDK/platforms/android-33"

          echo ""
          echo "Freetype:"
          find "$HOME/.buildozer/android/packages" \
            -type f \
            -name "freetype-2.14.1.tar.gz" \
            -print


      # ============================================================
      # 12. Clean only generated project build
      # ============================================================
      - name: Clean previous Buildozer build
        working-directory: app
        run: |
          set -eux

          rm -rf .buildozer/android/platform/build-*
          rm -rf .buildozer/android/platform/python-for-android


      # ============================================================
      # 13. Build APK
      # ============================================================
      - name: Build APK
        working-directory: app
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "24"
        run: |
          set -eux

          echo "=========================================="
          echo "STARTING BUILDOZER"
          echo "=========================================="

          buildozer -v android debug


      # ============================================================
      # 14. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: app
        run: |
          set -eux

          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find bin -type f -name "*.apk" -print

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

          ls -lh bin/*.apk


      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-vision-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
```
