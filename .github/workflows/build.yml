name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # ============================================================
      # 3. Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. System dependencies
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            unzip \
            zip \
            wget \
            curl \
            rsync \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncurses6 \
            libstdc++6


      # ============================================================
      # 5. Python build tools
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "cython<3.1"

          python -m pip install "buildozer==1.5.0"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Buildozer:"
          buildozer --version


      # ============================================================
      # 6. Prepare Android SDK
      # ============================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          RUNNER_SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK PREPARATION"
          echo "=========================================="

          echo ""
          echo "Runner SDK:"
          echo "$RUNNER_SDK"

          echo ""
          echo "Buildozer SDK:"
          echo "$BUILDOZER_SDK"

          if [ ! -d "$RUNNER_SDK" ]; then
            echo "ERROR: GitHub Actions Android SDK not found."
            exit 1
          fi

          mkdir -p "/home/runner/.buildozer/android/platform"

          rm -rf "$BUILDOZER_SDK"

          mkdir -p "$BUILDOZER_SDK"

          rsync -a "$RUNNER_SDK/" "$BUILDOZER_SDK/"

          echo ""
          echo "SDK copied successfully."

          echo ""
          echo "SDK contents:"
          find "$BUILDOZER_SDK" -maxdepth 2 -type d | sort | head -100


      # ============================================================
      # 7. Fix sdkmanager for Buildozer 1.5
      # ============================================================

      - name: Configure sdkmanager
        shell: bash
        run: |
          set -e

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "CONFIGURING SDKMANAGER"
          echo "=========================================="

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo ""
            echo "SDK contents:"
            find "$SDK" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo ""
          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p "$SDK/tools/bin"

          rm -f "$SDK/tools/bin/sdkmanager"

          ln -s "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Created compatibility path:"
          ls -lah "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "Testing sdkmanager..."

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # 8. Android environment
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROIDSDK=$SDK"
            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/emulator"
          } >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"


      # ============================================================
      # 9. Install SDK components
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK="/home/runner/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/tools/bin/sdkmanager"

          echo "=========================================="
          echo "INSTALLING ANDROID SDK COMPONENTS"
          echo "=========================================="

          echo ""
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo ""
          echo "Installing required components..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 10. Verify SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "VERIFYING ANDROID SDK"
          echo "=========================================="

          echo ""
          echo "sdkmanager:"
          ls -lah "$SDK/tools/bin/sdkmanager"

          echo ""
          echo "sdkmanager version:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Platforms:"
          ls -lah "$SDK/platforms"

          echo ""
          echo "Build tools:"
          ls -lah "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          ls -lah "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL version:"
          "$SDK/build-tools/35.0.0/aidl" --version || true


      # ============================================================
      # 11. Verify project
      # ============================================================

      - name: Verify project
        shell: bash
        run: |
          set -e

          if [ ! -f "app/buildozer.spec" ]; then
            echo "ERROR: app/buildozer.spec not found."
            exit 1
          fi

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          echo ""
          echo "Project found."

          echo ""
          echo "buildozer.spec:"
          cat app/buildozer.spec


      # ============================================================
      # 12. Verify Android configuration
      # ============================================================

      - name: Verify Buildozer configuration
        working-directory: app
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo ""
          grep -E \
            "^(android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.archs|p4a\.branch|requirements)" \
            buildozer.spec || true


      # ============================================================
      # 13. Build APK
      # ============================================================

      - name: Build APK
        working-directory: app
        shell: bash
        run: |
          set -e

          SDK="/home/runner/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROIDSDK="$SDK"

          echo "=========================================="
          echo "BUILDING UGARITIC OCR STUDIO PRO"
          echo "=========================================="

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ============================================================
      # 14. Show APK
      # ============================================================

      - name: Show APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          echo ""
          echo "APK/AAB files:"

          find app/bin \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

          echo ""
          echo "bin directory:"

          ls -lah app/bin 2>/dev/null || true


      # ============================================================
      # 15. Upload APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-ocr-studio-pro-apk
          path: app/bin/*.apk
          if-no-files-found: error


      # ============================================================
      # 16. Upload build logs
      # ============================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            app/.buildozer/**/*.log
            app/.buildozer/**/*.txt
          if-no-files-found: ignore
