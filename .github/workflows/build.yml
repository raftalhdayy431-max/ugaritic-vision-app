name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive

      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

      BUILDOZER_WARN_ON_ROOT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip \
            git \
            curl \
            wget


      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

          buildozer --version


      # ============================================================
      # RESTORE BUILDOZER CACHE
      # ============================================================
      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # CREATE SDK DIRECTORY
      # ============================================================
      - name: Create Android SDK directory
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"
          mkdir -p "$SDK/licenses"
          mkdir -p "$SDK/build-tools"
          mkdir -p "$SDK/platform-tools"
          mkdir -p "$SDK/platforms"
          mkdir -p "$SDK/cmdline-tools"


      # ============================================================
      # COPY COMMAND LINE TOOLS
      # ============================================================
      - name: Install Android command line tools
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SOURCE_SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SOURCE_SDK/cmdline-tools/latest" ]; then
            echo "Android command line tools not found"
            exit 1
          fi

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            rm -rf "$SDK/cmdline-tools/latest"

            mkdir -p "$SDK/cmdline-tools"

            cp -a \
              "$SOURCE_SDK/cmdline-tools/latest" \
              "$SDK/cmdline-tools/latest"

          fi

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # LEGACY SDKMANAGER COMPATIBILITY
      # ============================================================
      - name: Create Buildozer compatibility sdkmanager
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"


      # ============================================================
      # ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | \
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true


      # ============================================================
      # INSTALL SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      # ============================================================
      # VERIFY SDK
      # ============================================================
      - name: Verify Android SDK
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          test -x "$SDK/tools/bin/sdkmanager"
          test -d "$SDK/build-tools/33.0.2"
          test -x "$SDK/build-tools/33.0.2/aidl"
          test -d "$SDK/platforms/android-33"

          echo "========================================"
          echo "ANDROID SDK READY"
          echo "========================================"

          ls -la "$SDK/build-tools"
          ls -la "$SDK/platforms"


      # ============================================================
      # PATCH BUILDOZER SPEC
      # ============================================================
      - name: Configure Buildozer
        working-directory: app
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          sed -i '/^android.sdk_path *=/d' buildozer.spec
          sed -i '/^android.skip_update *=/d' buildozer.spec
          sed -i '/^android.accept_sdk_license *=/d' buildozer.spec

          cat >> buildozer.spec <<EOF

          # GitHub Actions configuration
          android.sdk_path = $SDK
          android.skip_update = True
          android.accept_sdk_license = True
          EOF


      # ============================================================
      # ADD TO PATH
      # ============================================================
      - name: Configure Android PATH
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # PRE-DOWNLOAD FREETYPE WITH STRONG RETRIES
      # ============================================================
      - name: Pre-download FreeType
        working-directory: app
        run: |
          set -eux

          PACKAGE_DIR="$PWD/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"

          mkdir -p "$PACKAGE_DIR"

          cd "$PACKAGE_DIR"

          URL="https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"
          FILE="freetype-2.14.1.tar.gz"

          if [ ! -f "$FILE" ]; then

            echo "Downloading FreeType with retry..."

            curl \
              --location \
              --fail \
              --retry 15 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 1200 \
              -o "$FILE" \
              "$URL"

          fi

          echo "FreeType archive:"

          ls -lh "$FILE"

          echo "Testing archive..."

          tar -tzf "$FILE" > /dev/null

          echo "FreeType downloaded successfully."


      # ============================================================
      # SECOND FREETYPE MIRROR FALLBACK
      # ============================================================
      - name: Verify FreeType fallback
        working-directory: app
        run: |
          set -eux

          PACKAGE_DIR="$PWD/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype"

          FILE="$PACKAGE_DIR/freetype-2.14.1.tar.gz"

          if [ ! -s "$FILE" ]; then

            echo "Primary FreeType download missing."

            mkdir -p "$PACKAGE_DIR"

            cd "$PACKAGE_DIR"

            echo "Trying GitHub mirror..."

            curl \
              --location \
              --fail \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              -o freetype-2.14.1.tar.gz \
              https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz

          fi

          ls -lh "$FILE"


      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build Android APK
        working-directory: app
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -o pipefail

          echo "========================================"
          echo "STARTING ANDROID BUILD"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # SHOW APK
      # ============================================================
      - name: Verify generated APK
        working-directory: app
        run: |
          set -eux

          echo "APK files:"

          find bin -type f -name "*.apk" -print

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          ls -lh "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # UPLOAD BUILD LOG ON FAILURE
      # ============================================================
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: app/build.log
          if-no-files-found: ignore
          retention-days: 7
