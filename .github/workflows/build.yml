name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      # ============================================================
      # FORCE A SINGLE ANDROID SDK LOCATION
      # ============================================================
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

      # Java
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # Avoid interactive prompts
      DEBIAN_FRONTEND: noninteractive

      # Buildozer
      BUILDOZER_WARN_ON_ROOT: 0

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            unzip \
            zip \
            python3-dev \
            python3-pip \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses6:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            libtinfo6 \
            libtinfo6:i386 \
            autoconf \
            automake \
            libtool \
            pkg-config

          sudo apt-get clean


      # ============================================================
      # 5. INSTALL PYTHON BUILD TOOLS
      # ============================================================
      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

          buildozer --version


      # ============================================================
      # 6. CREATE BUILDOZER INTERNAL SDK STRUCTURE
      # ============================================================
      - name: Create forced Buildozer SDK directory
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          mkdir -p "$SDK/licenses"
          mkdir -p "$SDK/build-tools"
          mkdir -p "$SDK/platform-tools"
          mkdir -p "$SDK/platforms"
          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 7. COPY COMMAND LINE TOOLS INTO BUILDOZER SDK
      # ============================================================
      - name: Inject Android command line tools into Buildozer SDK
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SOURCE_SDK="${ANDROID_SDK_ROOT}"

          # GitHub runner SDK location fallback
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SOURCE_SDK="/usr/local/lib/android/sdk"
          fi

          echo "Source SDK: $SOURCE_SDK"
          echo "Target SDK: $SDK"

          if [ -d "$SOURCE_SDK/cmdline-tools/latest" ]; then

            rm -rf "$SDK/cmdline-tools/latest"

            cp -a \
              "$SOURCE_SDK/cmdline-tools/latest" \
              "$SDK/cmdline-tools/latest"

          else

            echo "ERROR: Android command-line tools not found"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager || true
            exit 1

          fi


      # ============================================================
      # 8. CREATE LEGACY tools/bin COMPATIBILITY LAYER
      #
      # Some Buildozer versions expect:
      # android-sdk/tools/bin/sdkmanager
      #
      # Modern Android SDK uses:
      # android-sdk/cmdline-tools/latest/bin/sdkmanager
      #
      # This symlink bridges both architectures.
      # ============================================================
      - name: Create legacy SDK tools compatibility symlink
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools"

          if [ -e "$SDK/tools/bin" ]; then
            rm -rf "$SDK/tools/bin"
          fi

          ln -s \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/tools/bin"

          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version


      # ============================================================
      # 9. PRE-INJECT LICENSE HASHES
      # ============================================================
      - name: Pre-inject Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
          8933bac1632f4fe7906bf174efb15daae6137ea2
          d56f518747f451e06a5bddb4d7afab13355d40f4
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

          chmod 644 "$SDK/licenses/android-sdk-license"

          cat "$SDK/licenses/android-sdk-license"


      # ============================================================
      # 10. ACCEPT LICENSES NON-INTERACTIVELY
      #
      # This is more reliable than hashes alone because sdkmanager
      # records currently required licenses directly.
      # ============================================================
      - name: Force accept all Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses


      # ============================================================
      # 11. PRE-INSTALL ALL REQUIRED SDK COMPONENTS
      #
      # IMPORTANT:
      # Do NOT use "|| true".
      # If installation fails, workflow MUST stop.
      # ============================================================
      - name: Force pre-install Android SDK packages
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-37" \
            "build-tools;33.0.2" \
            "build-tools;37.0.0"


      # ============================================================
      # 12. ACCEPT LICENSES AGAIN
      #
      # Ensures newly installed packages cannot trigger prompts.
      # ============================================================
      - name: Re-accept licenses after SDK installation
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses


      # ============================================================
      # 13. VERIFY BUILD TOOLS PHYSICALLY EXIST
      # ============================================================
      - name: Verify Android SDK installation
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "ANDROID SDK STRUCTURE"
          echo "=========================================="

          echo "SDK:"
          ls -la "$SDK"

          echo "------------------------------------------"
          echo "BUILD TOOLS:"
          ls -la "$SDK/build-tools"

          echo "------------------------------------------"
          echo "PLATFORMS:"
          ls -la "$SDK/platforms"

          echo "------------------------------------------"
          echo "VERIFY 33.0.2:"
          test -d "$SDK/build-tools/33.0.2"
          test -f "$SDK/build-tools/33.0.2/aidl"
          test -x "$SDK/build-tools/33.0.2/aidl"

          echo "------------------------------------------"
          echo "VERIFY 37.0.0:"
          test -d "$SDK/build-tools/37.0.0"
          test -f "$SDK/build-tools/37.0.0/aidl"
          test -x "$SDK/build-tools/37.0.0/aidl"

          echo "------------------------------------------"
          echo "AIDL VERSION TEST:"
          "$SDK/build-tools/33.0.2/aidl" || true
          "$SDK/build-tools/37.0.0/aidl" || true

          echo "=========================================="
          echo "SDK VERIFICATION SUCCESSFUL"
          echo "=========================================="


      # ============================================================
      # 14. PATCH buildozer.spec
      #
      # Force Buildozer to use our SDK.
      # Disable its automatic SDK update mechanism.
      # ============================================================
      - name: Force patch Buildozer SDK configuration
        working-directory: app
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "PATCHING buildozer.spec"
          echo "=========================================="

          if grep -q "^android.sdk_path" buildozer.spec; then
            sed -i \
              "s|^android.sdk_path *=.*|android.sdk_path = $SDK|" \
              buildozer.spec
          else
            echo "" >> buildozer.spec
            echo "# Forced GitHub Actions SDK" >> buildozer.spec
            echo "android.sdk_path = $SDK" >> buildozer.spec
          fi

          if grep -q "^android.skip_update" buildozer.spec; then
            sed -i \
              "s|^android.skip_update *=.*|android.skip_update = True|" \
              buildozer.spec
          else
            echo "android.skip_update = True" >> buildozer.spec
          fi

          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              "s|^android.accept_sdk_license *=.*|android.accept_sdk_license = True|" \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo ""
          echo "=========================================="
          echo "FINAL ANDROID CONFIG"
          echo "=========================================="

          grep -E \
            "android.sdk_path|android.skip_update|android.accept_sdk_license|android.api|android.minapi" \
            buildozer.spec || true


      # ============================================================
      # 15. FORCE ENVIRONMENT INTO GITHUB PATH
      # ============================================================
      - name: Inject Android tools into PATH
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/37.0.0" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # 16. FINAL ENVIRONMENT DIAGNOSTICS
      # ============================================================
      - name: Final Android environment diagnostics
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo ""
          echo "sdkmanager:"
          which sdkmanager || true

          echo ""
          echo "adb:"
          which adb || true

          echo ""
          echo "SDK manager list:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list | head -n 100 || true


      # ============================================================
      # 17. CLEAN OLD BUILDOZER STATE
      #
      # Prevent stale partially-downloaded SDK state.
      # ============================================================
      - name: Clean stale project build cache
        working-directory: app
        run: |
          rm -rf .buildozer


      # ============================================================
      # 18. BUILD APK
      # ============================================================
      - name: Build Android APK
        working-directory: app
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          PATH: /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:/home/runner/.buildozer/android/platform/android-sdk/platform-tools:/home/runner/.buildozer/android/platform/android-sdk/build-tools/37.0.0:/home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.2:/opt/hostedtoolcache/Python/3.10.*/x64/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          ls -la "$ANDROID_HOME/build-tools"

          buildozer -v android debug


      # ============================================================
      # 19. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        working-directory: app
        run: |
          set -eux

          echo "Generated files:"
          find bin -maxdepth 2 -type f -print

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
