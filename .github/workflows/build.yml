name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      DEBIAN_FRONTEND: noninteractive
      BUILDOZER_WARN_ON_ROOT: 0
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip \
            git


      # ============================================================
      # 5. INSTALL BUILDOZER
      # ============================================================
      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.1" buildozer
          buildozer --version


      # ============================================================
      # 6. CREATE SDK DIRECTORY
      # ============================================================
      - name: Create Android SDK directory
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"
          mkdir -p "$SDK/build-tools"
          mkdir -p "$SDK/platform-tools"
          mkdir -p "$SDK/platforms"
          mkdir -p "$SDK/cmdline-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"


      # ============================================================
      # 7. COPY ANDROID COMMAND LINE TOOLS
      # ============================================================
      - name: Inject Android command line tools
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SOURCE_SDK="/usr/local/lib/android/sdk"

          echo "Source SDK: $SOURCE_SDK"
          echo "Target SDK: $SDK"

          if [ ! -d "$SOURCE_SDK/cmdline-tools/latest" ]; then
            echo "ERROR: Android command-line tools not found"
            find /usr/local/lib/android -type f -name sdkmanager || true
            exit 1
          fi

          rm -rf "$SDK/cmdline-tools/latest"

          cp -a \
            "$SOURCE_SDK/cmdline-tools/latest" \
            "$SDK/cmdline-tools/latest"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # 8. LEGACY BUILDOZER SDKMANAGER WRAPPER
      # ============================================================
      - name: Create Buildozer sdkmanager compatibility wrapper
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version


      # ============================================================
      # 9. ACCEPT SDK LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/licenses"

          yes | \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses


      # ============================================================
      # 10. INSTALL ANDROID SDK COMPONENTS
      # ============================================================
      - name: Install Android SDK packages
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"


      # ============================================================
      # 11. VERIFY SDK
      # ============================================================
      - name: Verify Android SDK installation
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          test -x "$SDK/tools/bin/sdkmanager"
          test -d "$SDK/build-tools/33.0.2"
          test -x "$SDK/build-tools/33.0.2/aidl"
          test -d "$SDK/platforms/android-33"

          echo "=========================================="
          echo "ANDROID SDK VERIFIED SUCCESSFULLY"
          echo "=========================================="

          ls -la "$SDK/build-tools"
          ls -la "$SDK/platforms"


      # ============================================================
      # 12. PATCH BUILDOZER CONFIGURATION
      # ============================================================
      - name: Patch Buildozer configuration
        working-directory: app
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          # Remove old CI-specific overrides to avoid duplicates
          sed -i '/^android.sdk_path *=/d' buildozer.spec
          sed -i '/^android.skip_update *=/d' buildozer.spec
          sed -i '/^android.accept_sdk_license *=/d' buildozer.spec

          cat >> buildozer.spec <<EOF

          # GitHub Actions Android SDK configuration
          android.sdk_path = $SDK
          android.skip_update = True
          android.accept_sdk_license = True
          EOF

          echo "=========================================="
          echo "FINAL ANDROID SETTINGS"
          echo "=========================================="

          grep -E \
            "android.api|android.sdk|android.build_tools_version|android.ndk|android.sdk_path|android.skip_update" \
            buildozer.spec || true


      # ============================================================
      # 13. ADD SDK TO PATH
      # ============================================================
      - name: Add Android SDK tools to PATH
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/33.0.2" >> "$GITHUB_PATH"


      # ============================================================
      # 14. CLEAN OLD PROJECT CACHE
      # ============================================================
      - name: Clean old Buildozer cache
        working-directory: app
        run: |
          rm -rf .buildozer


      # ============================================================
      # 15. FINAL ENVIRONMENT CHECK
      # ============================================================
      - name: Final Android environment diagnostics
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Modern sdkmanager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          echo ""
          echo "Buildozer compatibility sdkmanager:"
          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --version

          echo ""
          echo "Installed Build Tools:"
          ls -la "$SDK/build-tools"


      # ============================================================
      # 16. BUILD APK WITH NETWORK RETRY
      # ============================================================
      - name: Build Android APK with retry
        working-directory: app
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -o pipefail

          echo "=========================================="
          echo "STARTING BUILDOZER BUILD"
          echo "=========================================="

          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do

            echo ""
            echo "=========================================="
            echo "BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "=========================================="

            rm -f build.log

            if buildozer -v android debug 2>&1 | tee build.log; then
              echo ""
              echo "=========================================="
              echo "BUILD SUCCESSFUL"
              echo "=========================================="
              exit 0
            fi

            echo ""
            echo "BUILD FAILED ON ATTEMPT $ATTEMPT"

            echo ""
            echo "========== DOWNLOAD ERROR DIAGNOSTICS =========="

            grep -B 20 -A 20 \
              -E "HTTP Error 502|HTTP Error 503|Bad Gateway|Download failed" \
              build.log || true

            if grep -qE "HTTP Error 502|HTTP Error 503|HTTP Error 504|Bad Gateway|Download failed" build.log; then

              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then

                WAIT_TIME=$((ATTEMPT * 30))

                echo ""
                echo "Temporary network/download failure detected."
                echo "Waiting $WAIT_TIME seconds before retry..."

                sleep $WAIT_TIME

                ATTEMPT=$((ATTEMPT + 1))

              else

                echo ""
                echo "Maximum retry attempts reached."

                exit 1
              fi

            else

              echo ""
              echo "This is NOT a temporary HTTP download error."
              echo "Stopping immediately to preserve the real error."

              exit 1

            fi

          done


      # ============================================================
      # 17. VERIFY GENERATED APK
      # ============================================================
      - name: Verify generated APK
        working-directory: app
        run: |
          set -eux

          echo "Searching for APK..."

          find bin -type f -print || true

          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "=========================================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
