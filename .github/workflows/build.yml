```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            unzip \
            zip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncurses6 \
            libstdc++6

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "cython<3.1"
          python -m pip install "buildozer==1.5.0"

      - name: Check project
        run: |
          test -f app/buildozer.spec
          echo "buildozer.spec found"
          echo ""
          cat app/buildozer.spec

      - name: Fix Buildozer configuration
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          replacements = {
              "android.minapi = 21": "android.minapi = 24",
              "android.minapi=21": "android.minapi = 24",
              "android.build_tools_version = 37.0.0": "android.build_tools_version = 33.0.2",
              "android.build_tools_version=37.0.0": "android.build_tools_version = 33.0.2",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if "android.minapi" not in text:
              text += "\nandroid.minapi = 24\n"

          p.write_text(text)

          print("Final Android settings:")
          for line in text.splitlines():
              if line.strip().startswith("android."):
                  print(line)
          PY

      - name: Build APK
        working-directory: app
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING UGARITIC VISION AI"
          echo "========================================"

          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find app/bin -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

          ls -lah app/bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-vision-ai-apk
          path: app/bin/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/.buildozer/**/*.log
            app/.buildozer/**/*.txt
          if-no-files-found: ignore
```
