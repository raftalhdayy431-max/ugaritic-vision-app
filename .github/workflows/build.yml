name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev zlib1g-dev unzip libncurses6:i386 libstdc++6:i386 zlib1g:i386 openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade cython buildozer

    - name: Reverse-Engineer & Force Pre-Install SDK Tools & Licenses
      run: |
        # 1. Create buildozer's internal Android SDK directory tree
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/licenses"
        mkdir -p "$SDK_DIR/build-tools"
        mkdir -p "$SDK_DIR/platforms"
        mkdir -p "$SDK_DIR/platform-tools"

        # 2. Inject comprehensive cryptographic license hashes to bypass all prompts permanently
        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
        8933bac1632f4fe7906bf174efb15daae6137ea2
        d56f518747f451e06a5bddb4d7afab13355d40f4
        24333f8a63b6825ea9c5514f83c2829b004d1fee
        d975f751698a77b660f125453ed878c21cef687b
        504667f4c00dcd19eeb1cddf131da0e6cc139652
        EOF

        # Create additional license file for newer extensions if required by sdkmanager
        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
        84831b9409646a918e30573bab4c9c91346d8abd
        EOF

        # 3. Hijack environment variables to point straight to the forced structure
        export ANDROID_HOME="$SDK_DIR"
        export ANDROID_SDK_ROOT="$SDK_DIR"
        export PATH="$SDK_DIR/platform-tools:$SDK_DIR/tools/bin:$PATH"

        # 4. Locate GitHub Actions runner's pre-installed SDK or download command-line tools if missing
        CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$CMDLINE_TOOLS" ]; then
          # Fallback to runner's default Android SDK command-line tools if available
          DEFAULT_SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$DEFAULT_SDKMANAGER" ]; then
            CMDLINE_TOOLS="$DEFAULT_SDKMANAGER"
          fi
        fi

        # 5. Force installation of required packages directly via sdkmanager with automated license piping
        yes | "$CMDLINE_TOOLS" --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "build-tools;37.0.0" || true

        # 6. Ensure build-tools directories are correctly exposed where buildozer expects them
        if [ -d "/usr/local/lib/android/sdk/build-tools/37.0.0" ] && [ ! -d "$SDK_DIR/build-tools/37.0.0" ]; then
          ln -s /usr/local/lib/android/sdk/build-tools/37.0.0 "$SDK_DIR/build-tools/37.0.0"
        fi
        if [ -d "/usr/local/lib/android/sdk/build-tools/33.0.2" ] && [ ! -d "$SDK_DIR/build-tools/33.0.2" ]; then
          ln -s /usr/local/lib/android/sdk/build-tools/33.0.2 "$SDK_DIR/build-tools/33.0.2"
        fi

        # Verify build-tools presence
        ls -la "$SDK_DIR/build-tools"

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        cd app && buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ugaritic-apk
        path: app/bin/*.apk
