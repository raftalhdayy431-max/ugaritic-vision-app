name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      P4A_DOWNLOAD_CACHE: /home/runner/.buildozer/android/packages

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python 3.10
      # ============================================================
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Linux dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            unzip \
            zip \
            wget \
            curl \
            rsync \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ninja-build \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncurses6 \
            libstdc++6 \
            openjdk-17-jdk

          sudo apt-get clean


      # ============================================================
      # 5. Show Android SDK / NDK
      # ============================================================
      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          echo ""
          echo "Installed Android SDK:"
          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk" || true


      # ============================================================
      # 6. Install exact SDK 33 + Build Tools 33.0.2
      # ============================================================
      - name: Install Android SDK 33
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at:"
            echo "$SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo ""
          echo "SDK installation completed."


      # ============================================================
      # 7. Install NDK 25b
      # ============================================================
      - name: Install Android NDK 25b
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -d "$SDK/ndk/25.2.9519653" ]; then
            echo "Installing NDK 25.2.9519653..."

            "$SDKMANAGER" --sdk_root="$SDK" \
              "ndk;25.2.9519653"
          else
            echo "NDK 25.2.9519653 already exists."
          fi

          echo ""
          echo "Available NDK versions:"
          ls -la "$SDK/ndk" || true


      # ============================================================
      # 8. Configure NDK variables
      # ============================================================
      - name: Configure Android NDK
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/25.2.9519653"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "NDK configured:"
          echo "$NDK"

          "$NDK/ndk-build" --version || true


      # ============================================================
      # 9. Install Python build tools
      # ============================================================
      - name: Install Buildozer and Python-for-Android tools
        run: |
          python --version
          pip --version

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython<3.1" \
            "buildozer==1.5.0"

          echo ""
          echo "Installed packages:"
          pip show buildozer
          pip show cython


      # ============================================================
      # 10. Buildozer cache
      # ============================================================
      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.buildozer/android/packages
            /home/runner/.buildozer/android/platform
          key: buildozer-android33-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-android33-${{ runner.os }}-
            buildozer-android33-


      # ============================================================
      # 11. Prepare Buildozer directories
      # ============================================================
      - name: Prepare Buildozer
        shell: bash
        run: |
          mkdir -p /home/runner/.buildozer/android/packages
          mkdir -p /home/runner/.buildozer/android/platform

          echo "Buildozer cache:"
          du -sh /home/runner/.buildozer/android/packages 2>/dev/null || true


      # ============================================================
      # 12. Check buildozer.spec
      # ============================================================
      - name: Verify buildozer.spec
        run: |
          cd app

          echo "================ buildozer.spec ================"
          cat buildozer.spec
          echo "================================================="


      # ============================================================
      # 13. Clean only old build state
      # ============================================================
      - name: Prepare application build directory
        shell: bash
        run: |
          cd app

          mkdir -p bin

          # لا نحذف ~/.buildozer لأننا نريد الاستفادة من الـ cache
          rm -rf bin/*

          echo "Application directory:"
          ls -la


      # ============================================================
      # 14. Build APK
      # ============================================================
      - name: Build APK
        shell: bash
        working-directory: app
        run: |
          set -o pipefail

          echo "=============================================="
          echo "Starting Buildozer Android build"
          echo "=============================================="

          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "=============================================="
          echo "BUILD"
          echo "=============================================="

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 15. Retry build if network dependency fails
      # ============================================================
      - name: Retry APK build
        if: failure()
        shell: bash
        working-directory: app
        run: |
          echo ""
          echo "=============================================="
          echo "First build failed."
          echo "Retrying because dependency download may have"
          echo "returned HTTP 502/temporary network error."
          echo "=============================================="

          sleep 15

          buildozer -v android debug


      # ============================================================
      # 16. Show generated files
      # ============================================================
      - name: List APK files
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "APK FILES"
          echo "=============================================="

          find app/bin -maxdepth 1 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

          echo ""
          echo "BIN DIRECTORY:"
          ls -lah app/bin 2>/dev/null || true


      # ============================================================
      # 17. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-vision-ai-apk
          path: |
            app/bin/*.apk
          if-no-files-found: error


      # ============================================================
      # 18. Upload build log if failure
      # ============================================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            app/build.log
            app/.buildozer/android/platform/python-for-android/build.log
          if-no-files-found: ignore
