name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev zlib1g-dev unzip libncurses6:i386 libstdc++6:i386 zlib1g:i386 openjdk-17-jdk wget curl libltdl-dev

    - name: Install Buildozer, Cython and Build Tools
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-Download Android NDK r25b & Bypass Server 502 Errors
      run: |
        PLATFORM_DIR="/home/runner/.buildozer/android/platform"
        mkdir -p "$PLATFORM_DIR"

        NDK_ZIP="android-ndk-r25b-linux.zip"
        NDK_URL="https://dl.google.com/android/repository/$NDK_ZIP"
        
        echo "Downloading Android NDK r25b..."
        wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=30 -t 5 "$NDK_URL" || \
        curl -O --retry 5 --retry-delay 2 "$NDK_URL"

        echo "Extracting Android NDK r25b..."
        unzip -q "$NDK_ZIP" -d "$PLATFORM_DIR"
        
        if [ -d "$PLATFORM_DIR/android-ndk-r25b-linux" ]; then
          mv "$PLATFORM_DIR/android-ndk-r25b-linux" "$PLATFORM_DIR/android-ndk-r25b"
        elif [ -d "$PLATFORM_DIR/android-ndk-r25b" ]; then
          echo "NDK extracted successfully."
        fi
        
        rm -f "$NDK_ZIP"

    - name: Reverse-Engineer & Force Pre-Install SDK Tools & Licenses
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        
        mkdir -p "$SDK_DIR/licenses"
        mkdir -p "$SDK_DIR/build-tools/33.0.2"
        mkdir -p "$SDK_DIR/platforms/android-33"
        mkdir -p "$SDK_DIR/platform-tools"
        mkdir -p "$SDK_DIR/tools/bin"

        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
        8933bac1632f4fe7906bf174efb15daae6137ea2
        d56f518747f451e06a5bddb4d7afab13355d40f4
        24333f8a63b6825ea9c5514f83c2829b004d1fee
        d975f751698a77b660f125453ed878c21cef687b
        504667f4c00dcd19eeb1cddf131da0e6cc139652
        EOF

        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
        84831b9409646a918e30573bab4c9c91346d8abd
        EOF

        if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest" ]; then
          cp -r /usr/local/lib/android/sdk/cmdline-tools/latest/* "$SDK_DIR/tools/"
        fi

        export ANDROID_HOME="$SDK_DIR"
        export ANDROID_SDK_ROOT="$SDK_DIR"
        export PATH="$SDK_DIR/platform-tools:$SDK_DIR/tools/bin:$PATH"

        CMDLINE_TOOLS="$SDK_DIR/tools/bin/sdkmanager"
        if [ ! -f "$CMDLINE_TOOLS" ]; then
          CMDLINE_TOOLS="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
        fi

        yes | "$CMDLINE_TOOLS" --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" || true

    - name: Build APK with Buildozer (Debug Mode)
      run: |
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        cd app && buildozer -v --debug android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ugaritic-apk
        path: app/bin/*.apk
