```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      P4A_DOWNLOAD_CACHE: /home/runner/.buildozer/android/packages

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python 3.10
      # ============================================================
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Install Linux dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            unzip \
            zip \
            wget \
            curl \
            rsync \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ninja-build \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncurses6 \
            libstdc++6 \
            openjdk-17-jdk

          sudo apt-get clean


      # ============================================================
      # 5. Check environment
      # ============================================================
      - name: Check build environment
        run: |
          echo "=============================================="
          echo "PYTHON"
          echo "=============================================="
          python --version
          pip --version

          echo ""
          echo "=============================================="
          echo "JAVA"
          echo "=============================================="
          java -version

          echo ""
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "=============================================="
          echo "ANDROID PLATFORMS"
          echo "=============================================="

          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "=============================================="
          echo "ANDROID BUILD TOOLS"
          echo "=============================================="

          ls -la "$ANDROID_HOME/build-tools" || true

          echo ""
          echo "=============================================="
          echo "ANDROID NDK"
          echo "=============================================="

          ls -la "$ANDROID_HOME/ndk" || true


      # ============================================================
      # 6. Locate sdkmanager
      # ============================================================
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "Searching for sdkmanager..."

          find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true

          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager was not found."
              exit 1
            fi

            echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          fi

          echo "Using sdkmanager:"
          cat "$GITHUB_ENV" | grep SDKMANAGER


      # ============================================================
      # 7. Install SDK 33 + Build Tools 33.0.2
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing required Android SDK components..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo ""
          echo "SDK components installed."


      # ============================================================
      # 8. Install NDK 25b
      # ============================================================
      - name: Install Android NDK 25b
        shell: bash
        run: |
          set -e

          NDK_VERSION="25.2.9519653"

          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already installed."
          else
            echo "Installing NDK $NDK_VERSION..."

            "$SDKMANAGER" \
              --sdk_root="$ANDROID_HOME" \
              "ndk;$NDK_VERSION"
          fi

          echo ""
          echo "Available NDK versions:"
          ls -la "$ANDROID_HOME/ndk"


      # ============================================================
      # 9. Configure NDK
      # ============================================================
      - name: Configure NDK environment
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/25.2.9519653"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID_NDK_HOME=$NDK"


      # ============================================================
      # 10. Install Buildozer
      # ============================================================
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            "cython<3.1" \
            "buildozer==1.5.0"

          echo ""
          echo "Installed versions:"
          python --version
          pip --version
          buildozer --version


      # ============================================================
      # 11. Restore Buildozer cache
      # ============================================================
      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.buildozer/android/packages
            /home/runner/.buildozer/android/platform
          key: buildozer-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ============================================================
      # 12. Prepare Buildozer directories
      # ============================================================
      - name: Prepare Buildozer directories
        shell: bash
        run: |
          mkdir -p /home/runner/.buildozer/android/packages
          mkdir -p /home/runner/.buildozer/android/platform

          echo "Buildozer directory:"
          ls -la /home/runner/.buildozer/android || true


      # ============================================================
      # 13. Verify project
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            echo ""
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          if [ ! -f "app/buildozer.spec" ]; then
            echo "ERROR: app/buildozer.spec not found."
            exit 1
          fi

          echo "Project found:"
          ls -la app

          echo ""
          echo "================ buildozer.spec ================"
          cat app/buildozer.spec
          echo "================================================="


      # ============================================================
      # 14. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        shell: bash
        working-directory: app
        run: |
          echo "Checking Android configuration..."

          grep -E \
            "android.api|android.minapi|android.ndk|android.sdk|android.build_tools_version|android.archs" \
            buildozer.spec || true

          echo ""
          echo "Expected:"
          echo "android.api = 33"
          echo "android.minapi = 24"
          echo "android.ndk = 25b"
          echo "android.sdk = 33"
          echo "android.build_tools_version = 33.0.2"


      # ============================================================
      # 15. Clean APK output only
      # ============================================================
      - name: Prepare APK output
        shell: bash
        run: |
          mkdir -p app/bin

          rm -f app/bin/*.apk
          rm -f app/bin/*.aab

          echo "APK output directory:"
          ls -la app/bin


      # ============================================================
      # 16. Build APK
      # ============================================================
      - name: Build APK
        shell: bash
        working-directory: app
        run: |
          set -o pipefail

          echo "=============================================="
          echo "BUILDING UGARITIC VISION AI"
          echo "=============================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 17. Retry build
      # ============================================================
      - name: Retry Buildozer
        if: failure()
        shell: bash
        working-directory: app
        run: |
          echo ""
          echo "=============================================="
          echo "BUILD FAILED"
          echo "Retrying build..."
          echo "=============================================="

          sleep 20

          buildozer -v android debug


      # ============================================================
      # 18. Find APK
      # ============================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          find app/bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true

          echo ""
          echo "BIN:"
          ls -lah app/bin 2>/dev/null || true


      # ============================================================
      # 19. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ugaritic-vision-ai-apk
          path: app/bin/*.apk
          if-no-files-found: error


      # ============================================================
      # 20. Upload logs if build fails
      # ============================================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            app/build.log
            app/.buildozer/android/platform/python-for-android/build.log
            app/.buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
```
