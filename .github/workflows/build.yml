name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev zlib1g-dev unzip libncurses6:i386 libstdc++6:i386 zlib1g:i386 openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade cython buildozer

    - name: Reverse-Engineer & Force Pre-Install SDK Tools & Licenses
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        
        # 1. إنشاء الهيكل التنظيمي الكامل لمسارات أندرويد وبيلدوزر القديمة والحديثة
        mkdir -p "$SDK_DIR/licenses"
        mkdir -p "$SDK_DIR/build-tools/33.0.2"
        mkdir -p "$SDK_DIR/platforms/android-33"
        mkdir -p "$SDK_DIR/platform-tools"
        mkdir -p "$SDK_DIR/tools/bin"

        # 2. زرع بصمات التراخيص الرسمية لمنع توقف البناء نهائياً
        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
        8933bac1632f4fe7906bf174efb15daae6137ea2
        d56f518747f451e06a5bddb4d7afab13355d40f4
        24333f8a63b6825ea9c5514f83c2829b004d1fee
        d975f751698a77b660f125453ed878c21cef687b
        504667f4c00dcd19eeb1cddf131da0e6cc139652
        EOF

        cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
        84831b9409646a918e30573bab4c9c91346d8abd
        EOF

        # 3. نسخ أدوات سطر الأوامر لمسار tools التقليدي ليتوافق مع فحص بيلدوزر الصارم
        if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest" ]; then
          cp -r /usr/local/lib/android/sdk/cmdline-tools/latest/* "$SDK_DIR/tools/"
        fi

        # 4. ضبط المتغيرات البيئية وتوجيه النظام بالكامل للمسار المحلي المزيف/المحكوم
        export ANDROID_HOME="$SDK_DIR"
        export ANDROID_SDK_ROOT="$SDK_DIR"
        export PATH="$SDK_DIR/platform-tools:$SDK_DIR/tools/bin:$PATH"

        # 5. التثبيت المسبق للإصدارات المطابقة لملف buildozer.spec (API 33 و Build-Tools 33.0.2)
        CMDLINE_TOOLS="$SDK_DIR/tools/bin/sdkmanager"
        if [ ! -f "$CMDLINE_TOOLS" ]; then
          CMDLINE_TOOLS="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
        fi

        yes | "$CMDLINE_TOOLS" --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" || true

        # 6. ربط الأدوات الجاهزة من بيئة الوثيقة الأساسية للرันر إن وجدت ضماناً للسرعة وعدم الفشل
        if [ -d "/usr/local/lib/android/sdk/build-tools/33.0.2" ] && [ ! "$(ls -A $SDK_DIR/build-tools/33.0.2)" ]; then
          cp -r /usr/local/lib/android/sdk/build-tools/33.0.2/* "$SDK_DIR/build-tools/33.0.2/"
        fi

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        cd app && buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ugaritic-apk
        path: app/bin/*.apk
